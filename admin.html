<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>本部・結果入力 | 新人戦大会</title>
  <link rel="stylesheet" href="css/style.css?v=1126a">
  <script defer src="config.js?v=1126a"></script><script defer src="js/logic.js?v=1126a"></script>
  <script defer src="js/api.js?v=1126a"></script><script defer src="js/bracket-view.js?v=1126a"></script><script defer src="js/admin-form.js?v=1126a"></script><script defer src="js/admin.js?v=1126a"></script>
</head>
<body class="admin">
  <header><p class="eyebrow">大会本部 · 全コート結果入力</p><h1>第二回全日本学生拳法新人戦大会</h1>
    <div class="toolbar"><button id="refresh">最新を読み込む</button><span id="updated">最終保存 —</span><button id="change-token" class="link">合言葉を変える</button></div>
  </header>
  <main>
    <form id="login" class="login"><h2>合言葉入力</h2><label for="token">合言葉</label><input id="token" type="password" autocomplete="current-password" required><button class="primary" type="submit">入力を始める</button><p class="hint" id="login-hint"></p></form>
    <div id="message" class="message" role="alert" aria-live="polite"></div><button id="retry" hidden>再送</button>
    <div id="editor" hidden>
      <section aria-label="いまの段階"><h2 id="phase-label"></h2><ol id="phases" class="phases"></ol></section>
      <div class="admin-layout" id="admin-layout">
        <section class="bracket-section"><div class="section-heading"><h2>トーナメント表</h2>
          <div role="tablist" aria-label="部門"><button id="tab-men" role="tab" aria-selected="true" aria-controls="bracket" data-block="男子">男子</button><button id="tab-women" role="tab" aria-selected="false" aria-controls="bracket" data-block="女子" tabindex="-1">女子</button></div></div>
          <p id="bracket-hint" class="hint">試合番号を押して結果を入力・直しできます。表は横にスクロールできます。</p>
          <div id="bracket" class="bracket-scroll" role="tabpanel" aria-labelledby="tab-men" aria-describedby="bracket-hint" tabindex="0"></div>
        </section>
        <section id="match-editor" class="match-editor" role="dialog" aria-labelledby="match-title" hidden>
          <div class="editor-heading"><h2 id="match-title" tabindex="-1"></h2><button id="close-editor" aria-label="編集窓を閉じる">閉じる</button></div>
          <p id="editor-notice" class="hint"></p>
          <div id="opponents" class="opponents"></div>
          <p id="winner-banner" class="winner-banner" role="status" aria-live="polite"></p>
          <p id="tie-hint" class="hint" hidden>同点です。代表戦・判定で勝ったチームを選んでください</p>
          <label for="result-note">メモ</label><select id="result-note"><option value="">なし</option><option>代表戦</option><option>判定</option><option>延長</option><option>不戦勝</option></select>
          <p id="result-reason" class="undo-reason" aria-live="polite"></p>
          <button id="save-result" class="primary">確定</button>
          <button id="undo-result" class="danger">この試合の結果を取り消す</button><p id="undo-reason" class="undo-reason"></p>
          <button id="set-current" class="link">この試合を試合中にする</button>
          <div id="editor-message" class="message" role="alert"></div><button id="editor-retry" hidden>再送</button>
        </section>
      </div>
      <details class="reset"><summary>全結果を消す（大会前の準備用）</summary><form id="reset-form"><label for="reset-confirm">確認文字 RESET を入力</label><input id="reset-confirm" autocomplete="off" required pattern="RESET"><button type="submit" class="danger">全結果を消す</button></form></details>
    </div>
  </main>
  <span id="mock" class="mock" hidden>テストモード</span>
</body>
</html>
